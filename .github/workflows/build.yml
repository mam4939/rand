name: Build Windows Exe

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Environment & Compile
        shell: cmd
        run: |
          :: Автоматический поиск и запуск инициализации Developer Command Prompt для VS 2022
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if %errorlevel% neq 0 (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\Tools\VsDevCmd.bat" -arch=x64
          )
          if %errorlevel% neq 0 (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat" -arch=x64
          )
          
          :: Компиляция вашего файла main.cpp с необходимыми библиотеками Windows API
          cl /EHsc main.cpp setupapi.lib iphlpapi.lib ws2_32.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandora-exe
          path: main.exe
